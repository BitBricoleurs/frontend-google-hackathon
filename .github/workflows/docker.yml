name: Docker Build Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - production

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: vars
        run: |
          # Determine environment from branch
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi

          echo "ENV=${ENV}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=frontend-${ENV}" >> $GITHUB_OUTPUT
          echo "Building Docker image for environment: ${ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            samu-ai-frontend:${{ steps.vars.outputs.IMAGE_TAG }}
            samu-ai-frontend:${{ steps.vars.outputs.IMAGE_TAG }}-${{ github.sha }}
            samu-ai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=${{ steps.vars.outputs.ENV }}

      - name: Build summary
        run: |
          echo "Docker image built successfully!"
          echo "Environment: ${{ steps.vars.outputs.ENV }}"
          echo "Tags:"
          echo "  - samu-ai-frontend:${{ steps.vars.outputs.IMAGE_TAG }}"
          echo "  - samu-ai-frontend:${{ steps.vars.outputs.IMAGE_TAG }}-${{ github.sha }}"
          echo "  - samu-ai-frontend:latest"

