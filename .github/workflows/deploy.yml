jobs:
  # This job waits for integration pipeline to complete
  wait-for-integration:
    name: Wait for Integration Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Wait for integration checks
        uses: lewagon/wait-on-check-action@v1.3.3
        with:
          ref: ${{ github.ref }}
          check-name: 'Integration Pipeline Complete'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

