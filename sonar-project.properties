sonar.projectKey=BitBricoleurs_frontend-google-hackathon
sonar.organization=bitbricoleurs

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=frontend-google-hackathon
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/coverage/**,**/.next/**,**/dist/**,**/build/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# TypeScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__mocks__/**,**/node_modules/**